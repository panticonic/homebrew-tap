name: Update tap

# The tap updates itself rather than being pushed to. A cross-repository write
# would need a credential this organization does not allow (deploy keys are
# disabled) or a broad personal token; polling a public release needs neither,
# and the tap's own GITHUB_TOKEN is enough to write to the tap.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-cask.yml
      - scripts/render-cask.mjs
      - scripts/render-server-formula.mjs
      - scripts/renderers.test.mjs
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Vibestudio version to reconcile (defaults to newest stable)
        type: string
        required: false

concurrency:
  group: update-vibestudio-tap
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: Track the latest Vibestudio release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reconcile current release inputs against the current tap, including
          # when a previous run already published a commit before being rerun.
          ref: ${{ github.event.repository.default_branch }}

      - name: Test package renderers
        run: node --test scripts/renderers.test.mjs

      - name: Prepare generated package directories
        run: mkdir -p Casks Formula

      - name: Resolve one complete public product release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag="v$REQUESTED_VERSION"
          else
            tag=$(gh release list --repo panticonic/vibestudio --limit 100 \
              --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "no product release tagged v* yet; nothing to publish"
            exit 0
          fi
          release=$(gh release view "$tag" --repo panticonic/vibestudio \
            --json isDraft,isPrerelease,assets)
          test "$(jq -r '.isDraft' <<<"$release")" = false
          test "$(jq -r '.isPrerelease' <<<"$release")" = false
          for asset in Vibestudio-arm64.dmg SHA256SUMS-macos macos-signing.txt; do
            test "$(jq --arg asset "$asset" '[.assets[].name | select(. == $asset)] | length' <<<"$release")" -eq 1
          done
          printf 'tag=%s\nversion=%s\n' "$tag" "${tag#v}" >> "$GITHUB_OUTPUT"
          echo "product release: $tag"

      - name: Render the cask from that exact release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          asset=Vibestudio-arm64.dmg
          gh release download "$RELEASE_TAG" --repo panticonic/vibestudio --dir . \
            --pattern "$asset" --pattern SHA256SUMS-macos --pattern macos-signing.txt
          test "$(grep -Fc "  ./$asset" SHA256SUMS-macos)" -eq 1
          grep -F "  ./$asset" SHA256SUMS-macos | shasum -a 256 --check -
          signing=$(tr -d '[:space:]' < macos-signing.txt)
          case "$signing" in developer-id|ad-hoc) ;; *) exit 1 ;; esac
          echo "macOS signing mode: $signing"

          url="https://github.com/panticonic/vibestudio/releases/download/${RELEASE_TAG}/${asset}"
          node scripts/render-cask.mjs "$RELEASE_VERSION" "$asset" "$url" "$signing" > Casks/vibestudio.rb
          rm -f "$asset" SHA256SUMS-macos macos-signing.txt
          cat Casks/vibestudio.rb

      - name: Render the matching headless server formula
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          metadata=$(curl -fsSL \
            -H "accept: application/vnd.npm.install-v1+json" \
            https://registry.npmjs.org/@panticonic/vibestudio-server)
          tarball=$(jq -er --arg v "$RELEASE_VERSION" '.versions[$v].dist.tarball' <<<"$metadata")
          integrity=$(jq -er --arg v "$RELEASE_VERSION" '.versions[$v].dist.integrity' <<<"$metadata")
          curl -fsSL "$tarball" -o server.tgz
          actual="sha512-$(openssl dgst -sha512 -binary server.tgz | openssl base64 -A)"
          test "$actual" = "$integrity"
          sha256=$(sha256sum server.tgz | cut -d" " -f1)
          rm -f server.tgz
          node scripts/render-server-formula.mjs "$RELEASE_VERSION" "$tarball" "$sha256" \
            > Formula/vibestudio-server.rb
          cat Formula/vibestudio-server.rb

      - name: Validate coherent tap output
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/vibestudio.rb)" = "$RELEASE_VERSION"
          grep -Fq "vibestudio-server-${RELEASE_VERSION}.tgz" Formula/vibestudio-server.rb
          ruby -c Casks/vibestudio.rb
          ruby -c Formula/vibestudio-server.rb

      - name: Commit when the tap changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --short -- Casks/vibestudio.rb Formula/vibestudio-server.rb)" ]; then
            echo "tap already current"
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/vibestudio.rb)
          git config user.name "vibestudio-release"
          git config user.email "packages@vibestudio.app"
          git add Casks/vibestudio.rb Formula/vibestudio-server.rb
          git commit -m "vibestudio ${version}"
          git push
